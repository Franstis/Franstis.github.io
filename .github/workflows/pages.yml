# Builds the site and publishes it to GitHub Pages.
# Runs on every push, every day (to refresh the publication list from SciX and
# the CV from the Overleaf repository), and on demand from the Actions tab
# ("Run workflow").
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CV repository is private: CV_TOKEN is a token for it with
      # read and write access to its contents (write: to save publications.tex).
      # Without the token the step fails and the CV and Talks data in this
      # repository are used as they are.
      - name: Get the CV from Overleaf (Franstis/Academic-CV)
        id: cv
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Franstis/Academic-CV
          token: ${{ secrets.CV_TOKEN }}
          path: _cv

      - name: Update CV and talks from the LaTeX CV
        if: steps.cv.outcome == 'success'
        run: python3 scripts/update_cv.py _cv/main.tex

      # Also writes the CV's publication list (_cv/publications.tex)
      - name: Update publication list from SciX
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: |
          if [ -f _cv/main.tex ]; then
            python3 scripts/update_publications.py --tex _cv/publications.tex
          else
            python3 scripts/update_publications.py
          fi

      - name: Compile the CV PDF
        id: pdf
        if: steps.cv.outcome == 'success'
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: _cv
          root_file: main.tex

      # If the new publication list breaks the CV, show why (as warnings on the
      # run's summary page) and compile with the list saved in the CV repository
      - name: Report LaTeX errors and go back to the saved list
        if: steps.pdf.outcome == 'failure'
        working-directory: _cv
        run: |
          grep -A2 '^!' main.log | head -20 | while IFS= read -r line; do echo "::warning title=CV LaTeX error::$line"; done || true
          sudo chown -R "$(id -u)" .
          git checkout -- publications.tex
          rm -f main.aux main.fdb_latexmk main.fls main.log main.out main.pdf

      - name: Compile the CV PDF with the saved list
        id: pdf_saved
        if: steps.pdf.outcome == 'failure'
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: _cv
          root_file: main.tex

      - name: Add the CV PDF to the site
        if: steps.pdf.outcome == 'success' || steps.pdf_saved.outcome == 'success'
        run: mkdir -p assets/cv && cp _cv/main.pdf assets/cv/Francesco_Pistis_CV.pdf

      # Saves the new list, and publications-extra.tex without the papers SciX
      # now lists. Overleaf gets them with Menu → GitHub → Pull GitHub changes
      - name: Save the publication list in the CV repository
        if: steps.pdf.outcome == 'success'
        continue-on-error: true
        working-directory: _cv
        run: |
          git add publications.tex publications-extra.tex
          if git diff --cached --quiet; then
            echo "The publication list is unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update publications from SciX"
          git push

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
