# Builds the site and publishes it to GitHub Pages.
# Runs on every push, every Monday (to refresh the publication list from SciX),
# and on demand from the Actions tab ("Run workflow").
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update publication list from SciX
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python3 scripts/update_publications.py

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
